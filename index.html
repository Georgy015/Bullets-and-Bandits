<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Bullets &amp; Bandits</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #120c1c; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* Phones held upright: ask to turn the device (the game is landscape only) */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #120c1c; color: #ffd76a;
        font: bold 22px Georgia, serif; text-align: center; align-items: center; justify-content: center;
        flex-direction: column; gap: 18px; padding: 24px; box-sizing: border-box; }
      #rotate .phone { width: 46px; height: 76px; border: 4px solid #ffd76a; border-radius: 9px;
        animation: turn 1.8s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
    <!-- CrazyGames SDK v3. The game falls back to local stubs when it is unavailable. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div>Turn your device sideways to play</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
